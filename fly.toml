# Fly.io application definition.
#
# Before the first deploy:
#   fly launch --no-deploy       # creates the app on your account (reuses this file)
#   fly secrets set WHATSAPP_APP_SECRET=<value> WHATSAPP_VERIFY_TOKEN=<value> \
#     WHATSAPP_ACCESS_TOKEN=<value> WHATSAPP_PHONE_NUMBER_ID=<value> \
#     GROQ_API_KEY=<value> GEMINI_API_KEY=<value>
#   fly volume create limbot_cache --size 1    # embeddings model cache (once)
#   fly deploy
#
# Point Meta's webhook at https://<app>.fly.dev/webhooks/whatsapp.
# RAG stays off out of the box: a public Qdrant/embedding endpoint is not provisioned here.
# When you have one, set QDRANT_URL, QDRANT_API_KEY and flip RAG_ENABLED=true via secrets.

app = "limbot"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  AI_ENABLED = "true"
  RAG_ENABLED = "false"
  QDRANT_REQUIRED = "false"
  WHATSAPP_SIGNATURE_REQUIRED = "true"
  DEBUG_ENDPOINTS = "false"
  LOG_LEVEL = "INFO"
  LOG_JSON = "true"

[deploy]
  strategy = "rolling"

[[mounts]]
  source = "limbot_cache"
  destination = "/var/cache/limbot/embeddings"

[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["http", "tls"]

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/healthz"